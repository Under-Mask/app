<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6354f2" />
    <title>BrainFit Campus</title>
  </head>
  <body>
    <div class="phone">
      <div class="status"><span>9:41</span><span>LTE 100%</span></div>
      <main id="app" class="screen"></main>
      <nav class="tabbar" aria-label="주요 메뉴">
        <button class="tab active" data-view="home" type="button" aria-label="홈">
          <span class="ti">⌂</span><span>홈</span>
        </button>
        <button class="tab" data-view="record" type="button" aria-label="기록">
          <span class="ti">✎</span><span>기록</span>
        </button>
        <button class="tab" data-view="help" type="button" aria-label="도움">
          <span class="ti">?</span><span>도움</span>
        </button>
        <button class="tab" data-view="my" type="button" aria-label="마이">
          <span class="ti">◉</span><span>마이</span>
        </button>
      </nav>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
